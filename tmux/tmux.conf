# Use Ctrl-a as the prefix key and leave Ctrl-b free.
set -g prefix C-a
unbind C-b

# Remove the escape delay so vi-style key sequences feel immediate.
set -sg escape-time 0

# Start window and pane indexes at 1.
set-option -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# Reload tmux config with prefix + r.
bind r source-file ~/.config/tmux/tmux.conf\; display-message "Tmux config reloaded"

# Modern terminal settings for macOS/iTerm2.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -g focus-events on

# Use fish for new panes and windows.
set -g default-shell "/opt/homebrew/bin/fish"

# Resize panes with prefix + Ctrl-h/j/k/l.
bind -r C-h resize-pane -L
bind -r C-j resize-pane -D
bind -r C-k resize-pane -U
bind -r C-l resize-pane -R

# Move between panes with prefix + arrow.
bind-key Up    select-pane -U
bind-key Down  select-pane -D
bind-key Left  select-pane -L
bind-key Right select-pane -R

# Open new windows and panes in the current pane's directory.
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Keep program output from renaming windows.
set-option -g allow-rename off

# Use vi-like bindings for copy mode.
set-window-option -g mode-keys vi

# Increase scrollback.
set-option -g history-limit 10000

# Enable mouse support.
set -g mouse on

# Copy selections to the macOS pasteboard.
set -g set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'nhdaly/tmux-scroll-copy-mode'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Increase mouse scroll speed for tmux-scroll-copy-mode.
set -g @scroll-speed-num-lines-per-scroll 5

# Save tmux state periodically and restore it when tmux starts.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Initialize TPM when it is installed.
run '/opt/homebrew/opt/tpm/share/tpm/tpm'
